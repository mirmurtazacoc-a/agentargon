services:
  - type: web
    name: crypto-perp-terminal
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
